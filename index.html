<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Real logo artwork (see src/components/CyberDNSLogo.tsx) reused as
         the favicon too — dark/light swap follows the OS/browser color
         scheme via `media`, the only mechanism a static favicon has for
         reacting to theme (it can't see this app's own in-page toggle).
         The first, unconditional link is the fallback for browsers that
         don't support `media` matching on favicon links at all. -->
    <link rel="icon" type="image/svg+xml" href="/logo_light.svg" />
    <link rel="icon" type="image/svg+xml" href="/logo_light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logo_dark.svg" media="(prefers-color-scheme: dark)" />
    <!-- "Inter" and "IBM Plex Mono" are used throughout src/index.css
         (font-sans / font-mono) but were never actually loaded as web
         fonts anywhere — every browser was silently falling back to
         whatever generic sans-serif/monospace its own OS happens to ship
         (Arial/Segoe UI on Windows, different substitutes on Linux/macOS),
         which is exactly what made typography look inconsistent across
         different machines/environments. Loading the real fonts fixes
         that at the source instead of just re-ordering fallback names. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>CyberDNS TIP - Quản trị Danh sách Tên miền Chặn</title>
    <meta name="description" content="Hệ thống CyberDNS Threat Intelligence & Domain Blocklist Management." />
    <meta property="og:title" content="CyberDNS TIP - Quản trị Danh sách Tên miền Chặn" />
    <meta property="og:description" content="Hệ thống CyberDNS Threat Intelligence & Domain Blocklist Management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="font-sans antialiased bg-[#f4f7fb] text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
