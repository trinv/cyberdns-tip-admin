services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberdns_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env first — see .env.example}
      POSTGRES_DB: cyberdns_tip
    # The stock postgres image ships conservative defaults sized for a tiny
    # container, not a write-heavy sync workload (see .env.example's PG_*
    # variables for what these do and how to tune them for your VPS's actual
    # RAM/disk). max_wal_size back at Postgres' own compiled-in default
    # (1GB) deliberately, NOT raised further — raising it to 2GB here in an
    # earlier version made checkpoints fire less often but each one's I/O
    # stall roughly DOUBLE in duration (measured: ~530MB/checkpoint at ~60s
    # write time before, ~1.09GB/checkpoint at ~150-220s write time after —
    # same real disk throughput, ~6-8MB/s, just more data queued up before
    # each flush). On a VPS whose disk is this slow, a shorter-but-more-
    # frequent stall is the safer trade-off: it's less likely any single
    # stall runs long enough to trip a client/query timeout. This does NOT
    # fix the underlying cause — that's the VPS's actual disk write
    # throughput, which no Postgres setting can raise; see the deploy
    # troubleshooting notes for how to check it.
    command: >
      postgres
      -c max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      -c checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-15min}
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
    volumes:
      - cyberdns_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberdns_app -d cyberdns_tip"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default — the app container reaches it
    # over the internal Compose network only. Uncomment during development
    # if you want to inspect the database with a local psql/GUI client:
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL/DB_SSL is in .env — the app always
      # reaches Postgres through the internal Compose network at the `db`
      # hostname, over plain TCP (no TLS between containers on the same
      # Docker network).
      DATABASE_URL: postgres://cyberdns_app:${POSTGRES_PASSWORD}@db:5432/cyberdns_tip
      DB_SSL: "false"
      # Fixed regardless of PORT in .env — that PORT only controls the
      # HOST-side published port below; the app must keep listening on 3000
      # *inside* its own container for the "<host-port>:3000" mapping to
      # still point at the right place.
      PORT: "3000"
    ports:
      # Bound to 127.0.0.1 only — not reachable from outside this VPS at
      # all, Docker-level, regardless of firewall rules. Put Nginx in front
      # (see deploy/setup-domain-ssl.sh) and reach the app through it
      # instead of this port directly. This also matters for login
      # logging/new-IP detection to be meaningful: server.ts trusts
      # X-Forwarded-For from whoever connects to it, so if this port were
      # reachable directly, anyone could spoof their client IP.
      - "127.0.0.1:${PORT:-3000}:3000"

volumes:
  cyberdns_pgdata:
